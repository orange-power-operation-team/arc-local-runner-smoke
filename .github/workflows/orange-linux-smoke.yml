name: orange-linux-smoke

on:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: orange-linux
    steps:
      - name: Show runner context
        run: |
          uname -a
          whoami
          pwd
      - name: Check Docker in Docker
        run: |
          docker version
          docker run --rm alpine:3.20 echo "orange-dind-ok"
