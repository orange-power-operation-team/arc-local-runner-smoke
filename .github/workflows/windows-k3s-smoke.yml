name: windows-k3s-smoke

on:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: windows-k3s
    steps:
      - name: Allow local PowerShell scripts
        shell: cmd
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -Command "Set-ExecutionPolicy RemoteSigned -Scope CurrentUser -Force" || exit /b 0
      - name: Show runner context
        shell: powershell
        run: |
          $PSVersionTable.PSVersion
          [System.Environment]::OSVersion.VersionString
          whoami
          hostname
      - name: Check workspace
        shell: powershell
        run: |
          Get-Location
          Get-ChildItem Env:RUNNER_* | Sort-Object Name
          Write-Output "windows-k3s-ok"
      - name: Remove temporary OEM script
        shell: powershell
        run: |
          Remove-Item C:\OEM\install.bat -Force -ErrorAction SilentlyContinue
